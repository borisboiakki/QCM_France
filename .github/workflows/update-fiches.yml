name: Update fiches

# Rafraîchit le dump hors-ligne des fiches thématiques officielles
# (app/src/main/res/raw/fiches.json) depuis formation-civique.interieur.gouv.fr.
#
# Déclenchement MANUEL uniquement : Actions → « Update fiches » → Run workflow.
# Les runners GitHub ne sont pas soumis à la politique réseau qui bloque le
# domaine gouvernemental depuis les sessions Claude Code.
#
# Le résultat est poussé sur la branche `chore/update-fiches` (pas de PR créée par
# Actions — bloqué par le réglage « Allow GitHub Actions to create and approve pull
# requests »). Le résumé du run fournit un lien direct pour ouvrir la PR
# manuellement (relecture avant merge).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch fiches → push branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 markdownify

      - name: Fetch fiches
        run: |
          python scripts/fetch_fiches.py \
            --out app/src/main/res/raw/fiches.json \
            --dump-html /tmp/fiches-html

      # Archive le HTML brut : utile pour affiner l'extraction si la structure
      # du site a changé (sélecteurs / rendu JavaScript).
      - name: Upload raw HTML (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fiches-raw-html
          path: /tmp/fiches-html
          retention-days: 7
          if-no-files-found: ignore

      # Pousse le fiches.json régénéré sur une branche dédiée, sans créer de PR
      # (le token Actions n'y est pas autorisé). Le run affiche un lien « compare »
      # pour ouvrir la PR en un clic.
      - name: Commit & push updated fiches
        env:
          BRANCH: chore/update-fiches
        run: |
          if git diff --quiet -- app/src/main/res/raw/fiches.json; then
            echo "### Update fiches — aucun changement" >> "$GITHUB_STEP_SUMMARY"
            echo "\`fiches.json\` est déjà à jour, rien à pousser." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add app/src/main/res/raw/fiches.json
          git commit -m "Contenu : régénération de res/raw/fiches.json"
          git push --force origin "$BRANCH"
          {
            echo "### Fiches mises à jour ✅"
            echo ""
            echo "Branche poussée : \`$BRANCH\`"
            echo ""
            echo "👉 [Ouvrir la Pull Request](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1)"
            echo ""
            echo "**À vérifier avant merge :** nombre de fiches par thème cohérent, markdown lisible."
            echo "Si contenu vide → voir l'artifact \`fiches-raw-html\` (rendu JS ? fallback Playwright)."
          } >> "$GITHUB_STEP_SUMMARY"
