name: Release APK

on:
  push:
    tags:
      - 'v.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v.0.1.0)'
        required: true
        default: 'v.0.1.0'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Check signing configuration
        id: signing
        run: |
          if [ -n "$SIGNING_KEY_CHECK" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          SIGNING_KEY_CHECK: ${{ secrets.SIGNING_KEY }}

      # Étape A — Signing disponible (secrets configurés dans le dépôt)
      - name: Build & Sign Release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew assembleRelease --no-daemon
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Sign APK
        if: steps.signing.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename Signed APK
        if: steps.signing.outputs.available == 'true'
        run: mv "${{ steps.sign_apk.outputs.signedReleaseFile }}" "qcm-france-${{ steps.version.outputs.tag }}.apk"

      # Étape B — Pas de signing : APK debug (signé debug key, installable en sideload)
      - name: Build Debug APK (fallback)
        if: steps.signing.outputs.available == 'false'
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Debug APK (fallback)
        if: steps.signing.outputs.available == 'false'
        run: mv app/build/outputs/apk/debug/app-debug.apk "qcm-france-${{ steps.version.outputs.tag }}.apk"

      - name: Generate QUESTIONS.md
        run: python3 scripts/generate_questions_md.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "QCM France ${{ steps.version.outputs.tag }}"
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            qcm-france-${{ steps.version.outputs.tag }}.apk
            QUESTIONS.md
