name: Release APK

on:
  push:
    tags:
      - 'v.[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Étape A — Signing disponible (secrets configurés dans le dépôt)
      - name: Build & Sign Release APK
        if: ${{ secrets.SIGNING_KEY != '' }}
        run: ./gradlew assembleRelease --no-daemon
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Sign APK
        if: ${{ secrets.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename Signed APK
        if: ${{ secrets.SIGNING_KEY != '' }}
        run: mv "${{ steps.sign_apk.outputs.signedReleaseFile }}" "qcm-france-${{ github.ref_name }}.apk"

      # Étape B — Pas de signing : APK debug (signé debug key, installable en sideload)
      - name: Build Debug APK (fallback)
        if: ${{ secrets.SIGNING_KEY == '' }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename Debug APK (fallback)
        if: ${{ secrets.SIGNING_KEY == '' }}
        run: mv app/build/outputs/apk/debug/app-debug.apk "qcm-france-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "QCM France ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: "qcm-france-${{ github.ref_name }}.apk"
